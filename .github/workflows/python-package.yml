# This workflow runs the build, lints, and tests

name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{matrix.platform}}
    strategy:
      # show every combo's real result instead of the matrix cancelling the rest on first failure
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
        # matches setup.py's python_requires (>=3.10); 3.14 excluded because pygame has no
        # prebuilt wheel for it yet, which breaks the build on all platforms (falls back to a
        # source build that needs system SDL2/freetype headers CI runners don't have)
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        exclude:
          # ray[rllib] (see tests/requirements.txt) has no Windows wheel for 3.13 yet
          - platform: windows-latest
            python-version: "3.13"

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install mobile-env and additional dependencies
      run: |
        # sudo apt update -y
        # sudo apt install ffmpeg imagemagick
        python -m pip install --upgrade pip
        pip install .
        pip install -r tests/requirements.txt

    - name: Lint with flake8
      run: |
        flake8 mobile_env --per-file-ignores="__init__.py:F401"

    - name: Run tests with pytest
      run: |
        pytest

    - name: Run test notebook
      run: |
        pytest --nbmake examples/test.ipynb
